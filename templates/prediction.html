<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Insurance Prediction</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        .navbar {
            background: #1e3a8a;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        .full-width {
            grid-column: 1 / 3;
        }

        .predict-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;

            background: #2563eb;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 17px;
            cursor: pointer;
        }

        .predict-btn:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            background: #e0f2fe;
            border-radius: 10px;
            text-align: center;
        }

        .result h2 {
            color: #1e3a8a;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: 1;
            }

        }

    </style>

</head>

<body>

    <div class="navbar">

        <div class="logo">
            🛡 Insurance Predictor
        </div>

        <div class="nav-links">

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/logout">
                Logout
            </a>

        </div>

    </div>


    <div class="container">

        <h1>
            Insurance Price Prediction
        </h1>

        <p class="subtitle">
            Enter your details to estimate your insurance charges.
        </p>


        <form action="/predict" method="POST">

            <div class="form-grid">


                <!-- Age -->

                <div class="form-group">

                    <label>
                        Age
                    </label>

                    <input
                        type="number"
                        name="age"
                        min="0"
                        max="120"
                        required
                    >

                </div>


                <!-- Sex -->

                <div class="form-group">

                    <label>Sex</label>

                    <select name="sex" required>

                        <option value="female">Female</option>

                        <option value="male">Male</option>

                    </select>

                </div>


                <!-- BMI -->

                <div class="form-group">

                    <label>
                        BMI
                    </label>

                    <input
                        type="number"
                        name="bmi"
                        min="5"
                        max="100"
                        step="0.1"
                        required
                    >

                </div>


                <!-- Dependents -->

                <div class="form-group">

                    <label>
                        Dependents
                    </label>

                    <input
                        type="number"
                        name="dependents"
                        min="0"
                        max="20"
                        required
                    >

                </div>


                <!-- Smoker -->

                <div class="form-group">

                    <label>Smoker</label>

                    <select name="smoker" required>

                        <option value="no">No</option>

                        <option value="yes">Yes</option>

                    </select>

                </div>


                <!-- Salary -->

                <div class="form-group">

                    <label>
                        Annual Salary
                    </label>

                    <input
                        type="number"
                        name="salary"
                        min="0"
                        required
                    >

                </div>


                <!-- Expenditure -->

                <div class="form-group">

                    <label>
                        Annual Expenditure
                    </label>

                    <input
                        type="number"
                        name="expenditure"
                        min="0"
                        required
                    >

                </div>


                <!-- Occupation -->

                <div class="form-group">

                    <label>
                        Occupation
                    </label>

                    <label>Occupation</label>

                    <select name="occupation" required>

                        <option value="Business">Business</option>

                        <option value="CA">CA</option>

                        <option value="Farmer">Farmer</option>

                        <option value="Government">Government</option>

                        <option value="IT">IT</option>

                        <option value="Medical">Medical</option>

                        <option value="Other">Other</option>

                    </select>

                </div>


                <!-- Chronic Diseases -->

                <div class="form-group full-width">

                    <label>Chronic Disease</label>

                        <select name="chronic_diseases" required>

                            <option value="No">No</option>

                            <option value="Alzheimer">Alzheimer</option>

                            <option value="Asthma">Asthma</option>

                            <option value="Blood Pressure">Blood Pressure</option>

                            <option value="Cancer">Cancer</option>

                            <option value="Depression">Depression</option>

                            <option value="Diabetes">Diabetes</option>

                            <option value="Eczema">Eczema</option>

                            <option value="Kidney Disease">Kidney Disease</option>

                            <option value="Liver Disease">Liver Disease</option>

                            <option value="Obesity">Obesity</option>

                        </select>

                </div>


                <!-- Alcoholic -->

                <div class="form-group">

                    <label>Alcoholic</label>

                        <select name="alcoholic" required>

                            <option value="No">No</option>

                            <option value="Yes">Yes</option>

                        </select>

                </div>


                <!-- Marital Status -->

                <div class="form-group">

                    <label>Married</label>

                    <select name="marital_status" required>

                        <option value="No">No</option>

                        <option value="Yes">Yes</option>

                    </select>

                </div>


            </div>


            <button
                type="submit"
                class="predict-btn"
            >
                🔮 Predict Insurance Charges
            </button>

        </form>


        {% if prediction is not none %}

        <div class="result">

            <h2>
                💰 Estimated Insurance Charges
            </h2>

            <br>

            <h1>
                ₹ {{ "{:,.2f}".format(prediction) }}
            </h1>

        </div>

        {% endif %}


    </div>

</body>

</html>
